# Receipt layout for the "default" event.
# Re-read on every print, so edits here show up on the next photo.
# Block types: image | text | photo | qr | rule | spacer
# Variables you can use in text/qr: {event} {date} {time} {datetime} {quip}
#   plus any custom field you add to event.yaml

width: 576            # printer dots across (use 512 if the photo doesn't fill the paper)

photo:
  crop: square        # square | portrait | original
  gamma: 0.7          # <1 lifts shadows (more detail in darks)
  contrast: 1.1

blocks:
  - {type: spacer, height: 10}
  - {type: image,  src: logo.png, scale: 0.5}
  - {type: spacer, height: 10}
  - {type: text,   content: "{event}", size: 44}
  - {type: spacer, height: 16}
  - {type: photo}
  - {type: spacer, height: 16}
  - {type: text,   content: "{quip}", size: 30, italic: true}
  - {type: spacer, height: 12}
  - {type: qr,     data: "{qr_url}", scale: 6}
  - {type: text,   content: "{tagline}", size: 20}
  - {type: spacer, height: 12}
